# MkDocs + Material site for GitHub Pages. docs/ is the source (MkDocs'
# default docs_dir, so no override); site/ is the build output and is
# gitignored. Build with: pip install -r docs/requirements.txt && mkdocs build --strict
#
# site_name / site_description / page titles describe the tool, never the
# platforms it reads from -- see CONTRIBUTING.md and the Responsible Use rule.
site_name: numbers-go-up
site_description: >-
  Self-hosted, plugin-based counter tracker with history, rate-of-change,
  a REST API, and Home Assistant integration.
site_url: https://drewferg11.github.io/numbers-go-up/
site_author: DrewFerg11

repo_url: https://github.com/DrewFerg11/numbers-go-up
repo_name: DrewFerg11/numbers-go-up
edit_uri: edit/main/docs/

# Build inputs that live in docs/ but are not site content.
exclude_docs: |
  requirements.txt

theme:
  name: material
  # overrides/main.html adds the social-preview and noindex meta tags.
  custom_dir: overrides
  # No Google Fonts: Material's default fetches Roboto from fonts.googleapis.com
  # on every page view, which is a third-party request. The docs site follows
  # the same rule as the app -- no third-party network requests -- so the
  # system font stack is used instead. Code blocks use the system monospace.
  font: false
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  # The first palette entry is the default: dark, with a toggle to light.
  palette:
    - scheme: slate
      primary: black
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/a11y.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

# Decisions recorded here rather than left as omissions (issue #167):
#
# - No analytics plugin or tracking snippet, ever -- see docs/privacy.md.
# - No `social` plugin. It needs mkdocs-material[imaging] plus Cairo and
#   Pango in the workflow, and it is the feature most likely to need redoing
#   if the site moves off Material for MkDocs (#152). Shared links use one
#   static card image via overrides/main.html instead, which ports anywhere.
# - No `mike` (versioned docs). The site describes `latest`, which is right
#   for a single-deployment project. Revisit only if a release ships a
#   breaking config change that strands people on an older image.
plugins:
  - search

extra:
  # True only in branch-preview builds (docs-deploy.yml sets NGU_PREVIEW);
  # overrides/main.html turns it into a noindex tag so previews are never
  # indexed. Unset or empty means a normal build.
  preview: !ENV [NGU_PREVIEW, false]

# By default MkDocs only logs a page missing from the nav at INFO. Raise it
# (and broken nav entries) to warnings so --strict fails on them: that is
# what enforces "every page is reachable from the nav".
validation:
  nav:
    omitted_files: warn
    not_found: warn

# Stub pages are placeholders for the Pages-site issues that fill them in.
nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Configuration: getting-started/configuration.md
      - Config reference: getting-started/config-reference.md
  - Plugins:
      - plugins/index.md
      - MakerWorld: plugins/makerworld.md
      - GitHub: plugins/github.md
      - YouTube: plugins/youtube.md
      - Abacus: plugins/abacus.md
      - TikTok: plugins/tiktok.md
      - Metric catalogue: plugins/metrics.md
      - Writing a plugin: plugins/writing-a-plugin.md
  - Home Assistant: home-assistant/index.md
  - Operations: operations.md
  - Troubleshooting: troubleshooting.md
  - API reference: api.md
  - Demo: demo.md
  - Source status: status.md
  - Privacy: privacy.md
