# Daily live probes against real upstream sources (`pytest -m live`), which
# ci-test.yml deliberately excludes -- see its `-m "not live"` comment.
#
# Each source is its own matrix entry so one plugin's 403 can't mask another
# plugin's parse break, and adding a source is a one-line change.
#
# Filing policy:
#   - A single failure is noise -- MakerWorld and TikTok both 403 GitHub's
#     Azure IP ranges sometimes while working fine from a residential
#     connection (CONTRIBUTING.md, the broken_source issue template).
#   - Two *consecutive* failures for the same plugin open (or comment on) a
#     single tracking issue labelled canary + area:plugins, matching the
#     "Broken data source" template's own labels. There's no workflow
#     storage, so "consecutive" is read off the previous completed run of
#     this workflow rather than a state file.
#   - Recovery comments "green again" on the open issue rather than closing
#     it -- a 403 that clears on its own is exactly the intermittent break an
#     auto-close would hide.
#
# The probe's own UID secret must never reach a public issue: its value is
# scrubbed out of any captured output before it's used in an issue body.

name: Sources Canary

on:
  schedule:
    # 06:27 UTC. Off the hour: GitHub's scheduled-workflow queue backs up
    # at :00, and a canary that runs 40 minutes late all week isn't trusted.
    - cron: "27 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read  # gh run list/view (consecutive-failure lookup) hit the Actions API

jobs:
  probe:
    name: canary ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: makerworld
            secret_name: NGU_CANARY_MAKERWORLD_UID
          - plugin: github
            secret_name: NGU_CANARY_GITHUB_REPO
          - plugin: youtube
            secret_name: NGU_CANARY_YOUTUBE_CHANNEL_ID
            # Unlike GitHub, there's no free job-scoped token for YouTube's
            # Data API -- the canary needs its own API key secret too.
            extra_secret_name: NGU_YOUTUBE_API_KEY
          - plugin: abacus
            secret_name: NGU_CANARY_ABACUS_NAMESPACE
            # No auth token needed (unauthenticated source), but the
            # namespace alone doesn't identify a counter -- the canary
            # needs the key too, same shape as youtube's extra secret.
            extra_secret_name: NGU_CANARY_ABACUS_KEY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e . -r requirements-dev.txt

      # A missing secret makes the live test call pytest.skip(), which exits
      # 0 -- a canary that lost its secret would report green forever while
      # probing nothing. Fail here, before pytest ever runs.
      - name: Verify canary secret is set
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "::error::${{ matrix.secret_name }} is not set (or empty). The live probe would silently skip via pytest.skip() and this job would report green without probing anything. Set the secret under repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -n "$EXTRA_SECRET_NAME" ] && [ -z "$EXTRA_SECRET_VALUE" ]; then
            echo "::error::${EXTRA_SECRET_NAME} is not set (or empty). The live probe would silently skip via pytest.skip() and this job would report green without probing anything. Set the secret under repo Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          SECRET_VALUE: ${{ secrets[matrix.secret_name] }}
          EXTRA_SECRET_NAME: ${{ matrix.extra_secret_name }}
          EXTRA_SECRET_VALUE: ${{ matrix.extra_secret_name && secrets[matrix.extra_secret_name] }}

      - id: probe
        name: Run live probe
        continue-on-error: true
        shell: bash
        run: |
          # Export under the matrix's own secret name, not a hardcoded one --
          # a second plugin's matrix entry must not have to touch this line.
          export "${SECRET_NAME}=${SECRET_VALUE}"
          # GitHub is the one plugin that takes an optional token, and this
          # workflow already has one for free: the job's own GITHUB_TOKEN.
          # Using it keeps the canary off the unauthenticated 60/hr budget,
          # which Azure's shared runner IPs can otherwise exhaust from
          # unrelated traffic before this probe even runs.
          if [ "$PLUGIN" = "github" ]; then
            export NGU_GITHUB_TOKEN="$GH_ACTIONS_TOKEN"
          fi
          # youtube's matrix entry carries a second secret (its API key) --
          # export it under its own name, same convention as SECRET_NAME.
          if [ -n "$EXTRA_SECRET_NAME" ]; then
            export "${EXTRA_SECRET_NAME}=${EXTRA_SECRET_VALUE}"
          fi
          pytest -q -m live -k "$PLUGIN" 2>&1 | tee /tmp/canary-output.txt
          exit "${PIPESTATUS[0]}"
        env:
          PLUGIN: ${{ matrix.plugin }}
          SECRET_NAME: ${{ matrix.secret_name }}
          SECRET_VALUE: ${{ secrets[matrix.secret_name] }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
          EXTRA_SECRET_NAME: ${{ matrix.extra_secret_name }}
          EXTRA_SECRET_VALUE: ${{ matrix.extra_secret_name && secrets[matrix.extra_secret_name] }}

      # Scrub the secret value out of the captured output (tracebacks and
      # assertion diffs are the likely way it'd leak) before anything below
      # this point reads the file into an issue body.
      - name: Scrub secret from captured output
        if: always()
        run: |
          if [ -f /tmp/canary-output.txt ]; then
            # A sed s/// replace breaks (and fails open, unredacted) if the
            # secret value contains the delimiter. A literal string replace
            # has no delimiter to collide with.
            python3 -c 'import os, pathlib; p = pathlib.Path("/tmp/canary-output.txt"); text = p.read_text(); [text := text.replace(v, "<redacted>") for v in (os.environ.get("SECRET_VALUE"), os.environ.get("EXTRA_SECRET_VALUE")) if v]; p.write_text(text)'
          fi
        env:
          SECRET_VALUE: ${{ secrets[matrix.secret_name] }}
          EXTRA_SECRET_VALUE: ${{ matrix.extra_secret_name && secrets[matrix.extra_secret_name] }}

      - id: tail
        name: Collect (scrubbed) error tail
        if: always()
        run: |
          {
            echo "tail<<CANARY_EOF"
            tail -n 30 /tmp/canary-output.txt 2>/dev/null || echo "(no output captured)"
            echo "CANARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        run: |
          TITLE="Source broken: ${PLUGIN} (canary)"
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"

          EXISTING=$(gh issue list --repo "$REPO" --label canary --label area:plugins --state open \
            --search "in:title \"${TITLE}\"" --json number,title \
            --jq "[.[] | select(.title == \"${TITLE}\")][0].number // empty")

          if [ "$PROBE_OUTCOME" = "success" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "Green again as of ${RUN_URL}."
            fi
            exit 0
          fi

          # Anything other than an actual probe failure (e.g. "skipped",
          # because the secret-verify step above failed first) is a config
          # problem, not a broken source -- don't misfile it as one. The
          # verify step's own ::error:: is the signal for that case.
          if [ "$PROBE_OUTCOME" != "failure" ]; then
            echo "Probe outcome was '${PROBE_OUTCOME}', not a real probe failure; not evaluating for filing."
            exit 0
          fi

          # Failure. Consecutive-failure count has no state file to live in,
          # so read it off the previous completed run of this workflow --
          # scoped to the branch the schedule actually runs on, so a
          # workflow_dispatch test run from a feature branch (this PR
          # included) can't join or break the real streak.
          PREV_RUN_ID=$(gh run list --repo "$REPO" --workflow sources-canary.yml \
            --branch "$DEFAULT_BRANCH" \
            --json databaseId,status --jq '[.[] | select(.status == "completed")][0].databaseId // empty' \
            --limit 10)

          PREV_CONCLUSION=""
          if [ -n "$PREV_RUN_ID" ]; then
            PREV_CONCLUSION=$(gh run view "$PREV_RUN_ID" --repo "$REPO" --json jobs \
              --jq "[.jobs[] | select(.name | contains(\"canary ${PLUGIN}\"))][0].conclusion // empty")
          fi

          BODY=$(printf '**Symptom:** live probe failed (`pytest -m live -k %s`)\n**Where it ran:** GitHub Actions (Azure IP ranges) -- see the linked run for whether this reproduces from a residential connection.\n**Run:** %s\n\n```\n%s\n```\n' "$PLUGIN" "$RUN_URL" "$TAIL")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$(printf 'Failed again.\n\n%s' "$BODY")"
          elif [ "$PREV_CONCLUSION" = "failure" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --label canary --label area:plugins --body "$BODY"
          else
            echo "First failure this streak for ${PLUGIN}; not filing yet (threshold is 2 consecutive)."
          fi
        env:
          PLUGIN: ${{ matrix.plugin }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          TAIL: ${{ steps.tail.outputs.tail }}
          GH_TOKEN: ${{ github.token }}

      - name: Fail job if probe failed
        if: steps.probe.outcome != 'success'
        run: exit 1
