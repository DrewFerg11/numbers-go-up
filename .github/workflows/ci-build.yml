name: CI / Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: app:ci          # name-agnostic: no edit needed on rename
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # MVP acceptance: the container must come up and answer /health even
      # with zero plugins configured (design.md -> Failure Handling #6).
      - name: Boot the image and check /health
        run: |
          docker run -d --name ngu-ci -p 8080:8080 app:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/health; then echo; exit 0; fi
            sleep 1
          done
          echo "::error::/health never came up"
          docker logs ngu-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs ngu-ci || true