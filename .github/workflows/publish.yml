# Interim publish: amd64-only so the NAS can pull it for the Phase 3
# acceptance run (issue #27). Superseded at Phase 5 by
# docs/gh-workflows/publish.yml, which builds amd64+arm64 natively in
# parallel with semver tags. Same conventions here: GHCR + built-in
# GITHUB_TOKEN, name-agnostic image name, edge tag on main
# (latest only moves on a v* tag, per docs/gh-workflows/README.md).
name: Publish

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - requirements*.txt
      - numbers_go_up/**
      - .github/workflows/publish.yml
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build + push amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR requires lowercase image names; github.repository is mixed-case.
      - name: Resolve image name
        run: echo "IMAGE=${REGISTRY}/${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max