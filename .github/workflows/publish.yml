# Phase 5: continuous "edge" image on every push to main. Builds amd64 and
# arm64 NATIVELY in parallel (ubuntu-24.04-arm is free for public repos, GA
# since Aug 2025), then merges the two digests into one manifest -- this
# replaces QEMU emulation, which is roughly an order of magnitude slower and
# far flakier for any compiled wheel.
#
# linux/arm/v7 is the one exception: there is no free native 32-bit-ARM
# runner. ubuntu-24.04-arm is aarch64 and its image ships an aarch64-only
# userland, so AArch32 execution has never been demonstrated there -- the
# silicon (Neoverse N2) does support AArch32 at EL0; it is the runner image,
# not the CPU, that rules it out. So arm/v7 builds under QEMU, which is only
# affordable because requirements.txt drops uvicorn[standard].
#
# Tagged v* releases (semver + latest, GitHub Release, provenance
# attestation) are handled separately by release.yml, which is gated by the
# "release" environment and the "release tags" ruleset -- this workflow never
# touches those, so anyone who can push to main can produce an `edge` image,
# but only the repo owner can cut a release.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - requirements*.txt
      - numbers_go_up/**
      - .github/workflows/publish.yml
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm      # free on public repos; fails on private
            suffix: arm64
          # Not "arm/v7": the slash breaks the digest-${{ matrix.suffix }}
          # artifact name and the buildx cache scope.
          - platform: linux/arm/v7
            runner: ubuntu-latest
            suffix: armv7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # setuptools-scm needs full history + tags

      - name: Generate version file
        run: pip install setuptools-scm && python -m setuptools_scm --force-write-version-files

      # GHCR requires lowercase image names; github.repository is mixed-case.
      - name: Resolve image name
        run: echo "IMAGE=${REGISTRY}/${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      # Only linux/arm/v7 needs emulation; amd64 and arm64 stay native.
      - if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Push by digest only; the merge job assembles the real tags.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: merge manifest + tag
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name
        run: echo "IMAGE=${REGISTRY}/${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
