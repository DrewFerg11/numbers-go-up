name: Build task (maintainers)
description: A unit of planned work from the implementation guide — roughly one reviewable PR. Not for feature or bug reports.
title: "[Phase N] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        For planned work off the implementation guide. If you're reporting a
        problem or proposing a source, use one of the other templates.

        One issue per acceptance-criterion cluster, not per phase. If this would
        take a week and five PRs, split it.

  - type: input
    id: doc-link
    attributes:
      label: Source section
      description: Link to the section of the implementation guide (or another doc) this comes from.
      placeholder: docs/implementation-guide.md#phase-1--storage-layer--migrations
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: What to build
      description: The scope of this task. Keep it to what one PR can land.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        Copy these **verbatim** from the source doc. This is what a reviewer checks
        the PR against — paraphrasing here is how intent gets lost.
      placeholder: |
        - [ ] `pytest` green with no network access
        - [ ] `sqlite3 data/stats.db ".schema"` matches `database.md` exactly
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes and gotchas
      description: Anything the doc flags — measured numbers, known traps, ordering constraints.
    validations:
      required: false
