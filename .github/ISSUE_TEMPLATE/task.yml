name: Build task (maintainers)
description: A unit of planned work — roughly one reviewable PR. Not for feature or bug reports.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        For planned work. If you're reporting a problem or proposing a
        source, use one of the other templates.

        One issue per acceptance-criterion cluster, not per phase. If this would
        take a week and five PRs, split it.

  - type: input
    id: doc-link
    attributes:
      label: Source
      description: Link to the issue, discussion, or code comment this comes from, if any.
    validations:
      required: false

  - type: textarea
    id: build
    attributes:
      label: What to build
      description: The scope of this task. Keep it to what one PR can land.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        Copy these **verbatim** from the source, if there is one. This is what a
        reviewer checks the PR against — paraphrasing here is how intent gets lost.
      placeholder: |
        - [ ] `pytest` green with no network access
        - [ ] `ruff check .` and `ruff format --check .` clean
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes and gotchas
      description: Anything worth flagging — measured numbers, known traps, ordering constraints.
    validations:
      required: false
