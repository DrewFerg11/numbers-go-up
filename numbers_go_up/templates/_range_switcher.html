{# Shared by index.html and detail.html. The common ranges are a button row;
   the sub-day ones live in the "More" select so the row fits a phone (#120). #}
<nav class="range-switcher" aria-label="Time range">
  <div class="range-tabs" role="tablist">
    {% for r in ranges %}
    <button type="button" class="range-btn" data-range="{{ r }}" role="tab"
      aria-selected="{{ 'true' if r == range else 'false' }}">{{ r }}</button>
    {% endfor %}
  </div>
  {% if more_ranges %}
  <select class="range-more" aria-label="Shorter time ranges"
    data-active="{{ 'true' if range in more_ranges else 'false' }}">
    <option value=""{{ '' if range in more_ranges else ' selected' }}>More</option>
    {% for r in more_ranges %}
    <option value="{{ r }}"{{ ' selected' if r == range else '' }}>{{ r }}</option>
    {% endfor %}
  </select>
  {% endif %}
</nav>
