[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "numbers-go-up"
dynamic = ["version"]
description = "Self-hosted, plugin-based tracker for the counters you care about."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# This is the single, human-edited dependency list. requirements.txt is
# generated from it (a hashed, cross-platform lock -- see its own header)
# and must never be hand-edited; run the regeneration command in that
# header after changing anything here.
dependencies = [
    "fastapi>=0.115,<1",
    # Offline /docs and /redoc -- see the comment below on plain uvicorn.
    "fastapi-offline>=1.7,<2",
    # Plain uvicorn, not uvicorn[standard]: the [standard] extra pulls in
    # uvloop and httptools, which have no prebuilt linux/arm/v7 wheel and
    # would compile from source under QEMU on that platform's
    # release/publish build. Neither is measurable for this app's workload
    # (I/O-bound polling plus a handful of local dashboard requests, not a
    # high-QPS server). Do not restore the extra.
    "uvicorn>=0.34,<1",
    "pyyaml>=6,<7",
    "apscheduler>=3.11,<4",
    "httpx>=0.28,<1",
    "jinja2>=3,<4",
    # Only ever imported transitively via fastapi until now (api.py) --
    # declared explicitly so its version is pinned by name, not by
    # accident of whatever fastapi happens to pull in.
    "pydantic>=2,<3",
    "paho-mqtt>=2,<3",
]

[tool.setuptools]
packages = ["numbers_go_up", "numbers_go_up.migrations", "numbers_go_up.plugins"]

[tool.setuptools.package-data]
"numbers_go_up.migrations" = ["*.sql"]
"numbers_go_up" = ["templates/*.html", "static/**/*"]

[tool.setuptools_scm]
write_to = "numbers_go_up/_version.py"
# Edge builds (main, between tags) report e.g. "0.2.0.dev4" instead of
# "0.2.0.dev4+gabcdef0" -- the +g<sha> local segment isn't valid in a
# Docker tag and isn't useful in /health's version field either.
local_scheme = "no-local-version"

[tool.ruff]
target-version = "py312"
# Deliberately invalid syntax: proves discovery skips underscore-prefixed
# plugin files without ever attempting to import them.
extend-exclude = ["tests/fixtures/plugins/_underscored.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
    "live: hits real network endpoints; excluded from CI by default",
]
