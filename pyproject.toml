[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numbers-go-up"
dynamic = ["version"]
description = "Self-hosted, plugin-based tracker for the counters you care about."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
]

[tool.setuptools]
packages = ["numbers_go_up", "numbers_go_up.migrations", "numbers_go_up.plugins"]

[tool.setuptools.package-data]
"numbers_go_up.migrations" = ["*.sql"]

[tool.setuptools.dynamic]
version = { attr = "numbers_go_up.__version__" }

[tool.ruff]
target-version = "py312"
# Deliberately invalid syntax: proves discovery skips underscore-prefixed
# plugin files without ever attempting to import them.
extend-exclude = ["tests/fixtures/plugins/_underscored.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
    "live: hits real network endpoints; excluded from CI by default",
]
